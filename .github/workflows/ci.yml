name: CI

on:
  push:
    branches:
      - "**"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest       # linux amd64
          - ubuntu-24.04-arm    # linux arm64
          - macos-latest        # macOS arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o wtw .

      - uses: actions/upload-artifact@v4
        with:
          name: wtw-${{ matrix.runner }}
          path: wtw

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run ./...

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Check formatting
        run: |
          gofumpt -l .
          test -z "$(gofumpt -l .)" || (echo "Files not formatted. Run 'make fmt'" && exit 1)

  e2e:
    name: E2E (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v4
        with:
          name: wtw-${{ matrix.runner }}

      - name: Make binary executable
        run: chmod +x wtw

      - name: Setup git identity
        run: |
          git config --global user.email "test@test.com"
          git config --global user.name "Test"
          git config --global init.defaultBranch main

      - name: Run e2e tests
        run: WTW=./wtw go test ./e2e/... -v -timeout 120s

  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    needs: [build, lint, format, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Bump patch version and create tag
        run: |
          latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          base="${latest%-alpha}"
          base="${base#v}"
          IFS='.' read -r major minor patch <<< "$base"
          patch=$((patch + 1))
          next="v${major}.${minor}.${patch}-alpha"
          echo "Creating tag: $next"
          git tag "$next"
          git push origin "$next"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
