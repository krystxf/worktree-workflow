version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: wtw
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/krystof/worktree-workflow/internal/cmd.version={{.Version}}
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

brews:
  - name: wtw
    repository:
      owner: krystxf
      name: homebrew-wtw
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/krystxf/worktree-workflow"
    description: "TUI tool for managing git worktrees"
    license: "MIT"
    install: |
      bin.install "wtw"
